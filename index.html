<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>kamidere — Вход в систему</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --pad-x: clamp(20px, 6.95vw, 120px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      overscroll-behavior: none;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #000;
      isolation: isolate;
    }

    #scene {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #scene.dragging {
      cursor: grabbing;
    }

    .ui {
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
    }

    .ui a,
    .ui button {
      pointer-events: auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 15px;
      letter-spacing: -0.01em;
      text-decoration: none;
    }

    .logo-mark {
      width: 20px;
      height: 40px;
      border-radius: 0 20px 20px 0;
      background: #fff;
    }

    .logo b {
      font-weight: 700;
    }

    .logo span {
      font-weight: 400;
    }

    .nav-links {
      display: flex;
      gap: clamp(20px, 4.1vw, 60px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      position: relative;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .nav-links a::after {
      position: absolute;
      right: 0;
      bottom: -4px;
      left: 0;
      height: 1px;
      background: currentColor;
      content: '';
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }

    .arrow {
      display: grid;
      width: 38px;
      height: 38px;
      padding: 0;
      place-items: center;
      border: 2.5px solid #fff;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: background .25s, color .25s;
    }

    .arrow svg {
      width: 18px;
      height: 18px;
    }

    .arrow:hover,
    .arrow:focus-visible {
      background: #fff;
      color: #000;
    }

    .dots {
      position: absolute;
      top: 49.4%;
      right: calc(var(--pad-x) - 7px);
      display: flex;
      flex-direction: column;
      gap: 33px;
      transform: translateY(-50%);
    }

    .dot {
      width: 14px;
      height: 14px;
      padding: 0;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      transition: background .25s;
    }

    .dot.active {
      background: transparent;
    }

    .tagline {
      position: absolute;
      bottom: clamp(40px, 7.5vh, 70px);
      left: var(--pad-x);
      margin: 0;
      font-size: clamp(24px, 2.65vw, 44px);
      font-weight: 300;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .tagline strong {
      display: block;
      font-weight: 700;
    }

    .cta-row {
      position: absolute;
      top: 88.7%;
      right: -1vw;
      left: 45.6%;
      display: flex;
      align-items: center;
      transform: translateY(-50%);
    }

    .cta {
      display: inline-flex;
      height: 48px;
      flex: none;
      align-items: center;
      padding: 0 15px;
      border: 1.5px solid rgba(255, 255, 255, .85);
      border-radius: 6px;
      background: rgba(0, 0, 0, .15);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background .25s, color .25s;
    }

    .cta:hover,
    .cta:focus-visible {
      background: #fff;
      color: #000;
    }

    .cta-line {
      height: 1.5px;
      min-width: 40px;
      flex: 1;
      background: rgba(255, 255, 255, .8);
    }

    .count {
      flex: none;
      color: transparent;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
      transform: translateY(6%);
      user-select: none;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, .9);
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .6;
      transform: translate(-50%, -50%);
      transition: opacity .6s;
    }

    .loader.done {
      opacity: 0;
      pointer-events: none;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 5px;
    }

    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        top: 15%;
        right: var(--pad-x);
        left: auto;
        gap: 14px;
        transform: translateY(-50%);
      }

      .tagline {
        bottom: clamp(150px, 20vh, 220px);
      }

      .cta-row {
        top: auto;
        right: -3vw;
        bottom: 24px;
        left: var(--pad-x);
        transform: none;
      }

      .count {
        font-size: clamp(120px, 22vw, 200px);
      }
    }

    @media (max-width: 640px) {
      .nav-links {
        gap: 16px;
      }

      .nav-links a,
      .logo {
        font-size: 13px;
      }

      .dots {
        right: 16px;
        gap: 20px;
      }

      .dot {
        width: 10px;
        height: 10px;
      }

      .cta-row {
        right: -8vw;
      }

      .count {
        font-size: 120px;
      }
    }

    @media (max-width: 420px) {
      .nav-links li:nth-child(2) {
        display: none;
      }
    }

    html,
    body {
      overflow: hidden;
      overscroll-behavior: none;
    }

    .hero {
      min-height: 600px;
    }

    .ui {
      pointer-events: none;
    }

    .brand {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: #fff;
      font-size: 15px;
      letter-spacing: .01em;
      text-decoration: none;
      pointer-events: auto;
    }

    .brand-mark {
      width: 20px;
      height: 40px;
      border-radius: 0 20px 20px 0;
      background: #fff;
    }

    .brand strong {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.04em;
    }

    .brand span {
      margin-left: 2px;
      color: rgba(255, 255, 255, .5);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .scene-note {
      position: absolute;
      top: clamp(37px, 5.2vh, 52px);
      right: var(--pad-x);
      color: rgba(255, 255, 255, .64);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .login-panel {
      position: absolute;
      top: 51%;
      left: var(--pad-x);
      width: min(420px, calc(100vw - var(--pad-x) * 2));
      padding: clamp(23px, 3vw, 34px);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 8px;
      background: rgba(0, 0, 0, .82);
      box-shadow: 0 24px 90px rgba(0, 0, 0, .48);
      transform: translateY(-50%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      pointer-events: auto;
    }

    .panel-eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 15px;
      color: rgba(255, 255, 255, .58);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .panel-eyebrow::before {
      width: 22px;
      height: 1px;
      background: #fff;
      content: '';
    }

    .panel-title {
      margin: 0;
      font-size: clamp(27px, 3vw, 36px);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: 1.12;
    }

    .panel-copy {
      margin: 10px 0 23px;
      color: rgba(255, 255, 255, .58);
      font-size: 13px;
      font-weight: 300;
      line-height: 1.65;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 15px;
    }

    .login-field[hidden] {
      display: none !important;
    }

    .login-field label {
      color: rgba(255, 255, 255, .72);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .025em;
    }

    .login-input {
      width: 100%;
      height: 45px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: 4px;
      outline: 0;
      background: rgba(255, 255, 255, .045);
      color: #fff;
      font: inherit;
      font-size: 13px;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }

    .login-input::placeholder {
      color: rgba(255, 255, 255, .3);
    }

    .login-input:focus {
      border-color: rgba(255, 255, 255, .78);
      background: rgba(255, 255, 255, .075);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .07);
    }

    .login-submit {
      display: flex;
      width: 100%;
      min-height: 47px;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      padding: 0 15px;
      border: 1px solid #fff;
      border-radius: 4px;
      background: #fff;
      color: #000;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color .22s, background .22s, opacity .22s;
    }

    .login-submit:hover,
    .login-submit:focus-visible {
      background: transparent;
      color: #fff;
    }

    .login-submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    .submit-arrow {
      font-size: 19px;
      font-weight: 300;
      line-height: 1;
    }

    .login-message {
      min-height: 18px;
      margin: 10px 0 0;
      color: rgba(255, 255, 255, .72);
      font-size: 11px;
      line-height: 1.5;
    }

    .login-message.is-error {
      color: #ffb4b4;
    }

    .login-message.is-success {
      color: #c5ffd5;
    }

    .panel-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 17px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, .12);
      color: rgba(255, 255, 255, .42);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .panel-foot::before {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      content: '';
      box-shadow: 0 0 10px rgba(255, 255, 255, .8);
    }

    .arrows {
      left: auto;
      right: var(--pad-x);
      transform: none;
      pointer-events: auto;
    }

    .arrow {
      width: 34px;
      height: 34px;
      border-width: 1px;
      border-color: rgba(255, 255, 255, .65);
    }

    .arrow svg {
      width: 16px;
      height: 16px;
    }

    .loader {
      z-index: 3;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: 4px;
      background: rgba(0, 0, 0, .68);
      color: rgba(255, 255, 255, .8);
      pointer-events: none;
    }

    .loader.error {
      opacity: 1;
    }

    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .login-panel {
        top: auto;
        bottom: 24px;
        left: 50%;
        width: min(440px, calc(100vw - 36px));
        max-height: calc(100svh - 150px);
        overflow-y: auto;
        padding: 21px 23px;
        transform: translateX(-50%);
      }

      .panel-copy {
        margin: 7px 0 15px;
      }

      .login-field {
        margin-bottom: 11px;
      }

      .login-input {
        height: 42px;
      }

      .panel-foot {
        margin-top: 12px;
        padding-top: 10px;
      }

      .arrows {
        top: 14%;
        right: var(--pad-x);
      }
    }

    @media (max-width: 480px) {
      .hero {
        min-height: 600px;
      }

      .brand {
        gap: 8px;
      }

      .brand-mark {
        width: 16px;
        height: 32px;
      }

      .brand strong {
        font-size: 15px;
      }

      .brand span {
        font-size: 8px;
      }

      .scene-note {
        top: 89px;
        right: 20px;
        font-size: 8px;
      }

      .login-panel {
        bottom: 14px;
        width: calc(100vw - 28px);
        max-height: calc(100svh - 174px);
        padding: 19px 18px;
      }

      .panel-title {
        font-size: 27px;
      }

      .panel-copy {
        font-size: 12px;
      }

      .arrows {
        top: 13%;
        right: 20px;
      }

      .arrow {
        width: 32px;
        height: 32px;
      }
    }

    @media (max-height: 680px) and (min-width: 901px) {
      .login-panel {
        top: 54%;
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .panel-copy {
        margin-bottom: 14px;
      }

      .login-field {
        margin-bottom: 10px;
      }
    }
  </style>

</head>
<body>

    <canvas id="scene" aria-label="Полупрозрачный вращающийся куб. Перетаскивайте его мышью."></canvas>

        <p class="panel-copy">Войдите, чтобы управлять онлайн-записью и своим бизнесом.</p>

        <form class="auth-panel" id="login-form" autocomplete="on" novalidate>

            <label for="login-username">Логин</label>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js?v=3"></script>
  <script>
    (function () {
      'use strict';

      var loginForm = document.getElementById('login-form');
      var projectHint = new URLSearchParams(window.location.search).get('b');

      function showMessage(element, message, isError) {
        element.textContent = message;
        element.classList.toggle('is-error', Boolean(isError));
        element.classList.toggle('is-success', Boolean(message) && !isError);
      }

      function setSubmitting(form, submitting, label) {
        var button = form.querySelector('.login-submit');
        button.disabled = submitting;
        button.querySelector('span').textContent = submitting ? 'Проверяем данные…' : label;
      }

      loginForm.addEventListener('submit', async function (event) {
        event.preventDefault();
        var login = document.getElementById('login-username').value.trim();
        var password = document.getElementById('login-password').value;
        var message = document.getElementById('login-message');

        if (!login || !password) {
          showMessage(message, 'Введите логин и пароль.', true);
          return;
        }

        showMessage(message, '', false);
        setSubmitting(loginForm, true, 'Войти в кабинет');
        try {
          var account = await App.loginWithCredentials(login, password, projectHint);
          if (!account) {
            showMessage(message, 'Неверный логин или пароль.', true);
            return;
          }
          if (account.role === 'super_admin') {
            window.location.href = 'super.html';
          } else {
            window.location.href = 'admin.html?b=' + encodeURIComponent(account.projectId);
          }
        } catch (error) {
          console.error('Sign-in failed.', error);
          showMessage(message, 'Не удалось выполнить вход. Проверьте подключение и попробуйте ещё раз.', true);
        } finally {
          setSubmitting(loginForm, false, 'Войти в кабинет');
        }
      });
    }());
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';
    const hero = document.getElementById('hero');
    const canvas = document.getElementById('scene');
    const loaderLabel = document.getElementById('loader');
    const fontReady = Promise.race([
      Promise.all([document.fonts.load('800 100px Poppins'), document.fonts.ready]),
      new Promise((resolve) => setTimeout(resolve, 2500))
    ]);

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    } catch (error) {
      loaderLabel.textContent = 'WebGL is unavailable';
      loaderLabel.classList.add('error');
      console.error('Unable to initialize the WebGL renderer.', error);
      throw error;
    }

    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene = new THREE.Scene();
    const bgScene = new THREE.Scene();
    const bgCamera = new THREE.Camera();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    const headlineCanvas = document.createElement('canvas');
    const headlineContext = headlineCanvas.getContext('2d');
    const headlineTexture = new THREE.CanvasTexture(headlineCanvas);
    headlineTexture.colorSpace = THREE.SRGBColorSpace;
    headlineTexture.minFilter = THREE.LinearFilter;
    headlineTexture.magFilter = THREE.LinearFilter;
    headlineTexture.generateMipmaps = false;

    const bgMaterial = new THREE.ShaderMaterial({
      uniforms: { uTex: { value: headlineTexture } },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
          #include <colorspace_fragment>
        }
      `,
      depthTest: false,
      depthWrite: false,
      toneMapped: false
    });
    const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
    bgQuad.frustumCulled = false;
    bgScene.add(bgQuad);

    const pivot = new THREE.Group();
    const spinner = new THREE.Group();
    pivot.add(spinner);
    scene.add(pivot);
    spinner.rotation.set(-0.42, 0.62, 0.18);

    const makeGlassMaterial = (backside) => new THREE.ShaderMaterial({
      uniforms: {
        uTexture: { value: null },
        uResolution: { value: new THREE.Vector2(1, 1) },
        uIorR: { value: 1.15 },
        uIorY: { value: 1.16 },
        uIorG: { value: 1.18 },
        uIorC: { value: 1.22 },
        uIorB: { value: 1.22 },
        uIorP: { value: 1.22 },
        uRefractPower: { value: backside ? 0.22 : 0.30 },
        uChromatic: { value: 0.5 },
        uSaturation: { value: 1.08 },
        uShininess: { value: 90 },
        uDiffuseness: { value: 0.02 },
        uFresnelPower: { value: 5.0 },
        uLight: { value: new THREE.Vector3(-1, 1, 1) },
        uBackside: { value: backside ? 1 : 0 }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vEye;
        void main() {
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vec4 mvPos = viewMatrix * worldPos;
          gl_Position = projectionMatrix * mvPos;
          vNormal = normalize(normalMatrix * normal);
          vEye = normalize(mvPos.xyz);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTexture;
        uniform vec2 uResolution;
        uniform float uIorR;
        uniform float uIorY;
        uniform float uIorG;
        uniform float uIorC;
        uniform float uIorB;
        uniform float uIorP;
        uniform float uRefractPower;
        uniform float uChromatic;
        uniform float uSaturation;
        uniform float uShininess;
        uniform float uDiffuseness;
        uniform float uFresnelPower;
        uniform vec3 uLight;
        uniform float uBackside;
        varying vec3 vNormal;
        varying vec3 vEye;

        float specular(vec3 normal, vec3 lightDirection, vec3 viewDirection, float shininess, float diffuseness) {
          vec3 lightVec = normalize(-lightDirection);
          vec3 halfVec = normalize(lightVec + viewDirection);
          return pow(max(dot(normal, halfVec), 0.0), shininess)
            + max(0.0, dot(normal, lightVec)) * diffuseness;
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / uResolution;
          vec3 n = normalize(vNormal);
          if (uBackside > 0.5) n = -n;
          vec3 eye = normalize(vEye);
          vec3 color = vec3(0.0);
          const float LOOP = 16.0;

          for (int i = 0; i < 16; i++) {
            float slide = float(i) / LOOP * 0.045;
            vec2 refrR = refract(eye, n, 1.0 / uIorR).xy;
            vec2 refrY = refract(eye, n, 1.0 / uIorY).xy;
            vec2 refrG = refract(eye, n, 1.0 / uIorG).xy;
            vec2 refrC = refract(eye, n, 1.0 / uIorC).xy;
            vec2 refrB = refract(eye, n, 1.0 / uIorB).xy;
            vec2 refrP = refract(eye, n, 1.0 / uIorP).xy;

            vec3 texR = texture2D(uTexture, uv + refrR * (uRefractPower + slide) * uChromatic).rgb;
            vec3 texY = texture2D(uTexture, uv + refrY * (uRefractPower + slide) * uChromatic).rgb;
            vec3 texG = texture2D(uTexture, uv + refrG * (uRefractPower + slide * 2.0) * uChromatic).rgb;
            vec3 texC = texture2D(uTexture, uv + refrC * (uRefractPower + slide * 2.5) * uChromatic).rgb;
            vec3 texB = texture2D(uTexture, uv + refrB * (uRefractPower + slide * 3.0) * uChromatic).rgb;
            vec3 texP = texture2D(uTexture, uv + refrP * (uRefractPower + slide) * uChromatic).rgb;

            float r = texR.r * 0.5;
            float y = (texY.r * 2.0 + texY.g * 2.0 - texY.b) / 6.0;
            float g = texG.g * 0.5;
            float c = (texC.g * 2.0 + texC.b * 2.0 - texC.r) / 6.0;
            float b = texB.b * 0.5;
            float p = (texP.b * 2.0 + texP.r * 2.0 - texP.g) / 6.0;

            float red = r + (2.0 * p + 2.0 * y - c) / 3.0;
            float green = g + (2.0 * y + 2.0 * c - p) / 3.0;
            float blue = b + (2.0 * c + 2.0 * p - y) / 3.0;
            color += vec3(red, green, blue);
          }

          color /= LOOP;
          float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
          color = mix(vec3(luma), color, uSaturation);

          vec3 viewDirection = -eye;
          float spec = specular(n, uLight, viewDirection, uShininess, uDiffuseness)
            + 0.6 * specular(n, vec3(1.0, 1.0, -1.0), viewDirection, uShininess * 0.6, uDiffuseness * 0.5);
          color += vec3(spec * (uBackside > 0.5 ? 0.35 : 1.0));

          float fresnel = pow(1.0 + dot(eye, n), uFresnelPower);
          color = mix(color, vec3(1.0), fresnel * (uBackside > 0.5 ? 0.25 : 0.55));
          color += vec3(0.004, 0.005, 0.007);
          gl_FragColor = vec4(color, 1.0);
          #include <colorspace_fragment>
        }
      `,
      side: backside ? THREE.BackSide : THREE.FrontSide,
      depthTest: true,
      depthWrite: true,
      toneMapped: false
    });

    const backMaterial = makeGlassMaterial(true);
    const frontMaterial = makeGlassMaterial(false);
    let cube = null;
    let rtBack = null;
    let rtFront = null;
    let started = false;
    let viewportWidth = 1;
    let viewportHeight = 1;
    let spinRemaining = 0;
    let velocityX = 0;
    let velocityY = 0;
    let pointerLastX = 0;
    let pointerLastY = 0;
    let pointerLastTime = 0;
    let dragging = false;
    let idleBlendStart = performance.now();
    let previousFrame = 0;
    const bufferSize = new THREE.Vector2();
    const axisY = new THREE.Vector3(0, 1, 0);
    const axisX = new THREE.Vector3(1, 0, 0);
    const tempQuaternion = new THREE.Quaternion();

    function drawHeadline() {
      const width = viewportWidth;
      const height = viewportHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      headlineCanvas.width = Math.max(1, Math.round(width * dpr));
      headlineCanvas.height = Math.max(1, Math.round(height * dpr));
      headlineContext.setTransform(dpr, 0, 0, dpr, 0, 0);
      headlineContext.fillStyle = '#000';
      headlineContext.fillRect(0, 0, width, height);

      const mobile = width < 768 || width / height < 1;
      const maxWidth = width * (mobile ? 0.9 : 0.5);
      let fontSize = Math.min(height * 0.21, width * (mobile ? 0.21 : 0.118));
      const lines = ['Запись', 'без', 'границ'];
      headlineContext.textAlign = 'center';
      headlineContext.textBaseline = 'alphabetic';
      headlineContext.font = `800 ${fontSize}px Poppins`;
      const widestLine = Math.max(...lines.map((line) => headlineContext.measureText(line).width));
      if (widestLine > maxWidth) {
        fontSize *= maxWidth / widestLine;
        headlineContext.font = `800 ${fontSize}px Poppins`;
      }

      const centerX = width * (mobile ? 0.5 : 0.505);
      const centerY = height * (mobile ? 0.45 : 0.468);
      const lineGap = fontSize * 1.07;
      const capHeight = fontSize * 0.7;
      headlineContext.fillStyle = '#e9e9e9';
      lines.forEach((line, index) => {
        const baseline = centerY + capHeight / 2 + (index - 1) * lineGap;
        headlineContext.fillText(line, centerX, baseline);
      });
      headlineTexture.needsUpdate = true;
    }

    function layout() {
      if (!renderer) return;
      const bounds = hero.getBoundingClientRect();
      viewportWidth = Math.max(1, bounds.width);
      viewportHeight = Math.max(1, bounds.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(viewportWidth, viewportHeight, false);
      camera.aspect = viewportWidth / viewportHeight;
      camera.updateProjectionMatrix();

      renderer.getDrawingBufferSize(bufferSize);
      if (!rtBack) {
        const targetOptions = { type: THREE.HalfFloatType, depthBuffer: true };
        rtBack = new THREE.WebGLRenderTarget(bufferSize.x, bufferSize.y, targetOptions);
        rtFront = new THREE.WebGLRenderTarget(bufferSize.x, bufferSize.y, targetOptions);
        backMaterial.uniforms.uTexture.value = rtBack.texture;
        frontMaterial.uniforms.uTexture.value = rtFront.texture;
      } else {
        rtBack.setSize(bufferSize.x, bufferSize.y);
        rtFront.setSize(bufferSize.x, bufferSize.y);
      }
      backMaterial.uniforms.uResolution.value.copy(bufferSize);
      frontMaterial.uniforms.uResolution.value.copy(bufferSize);

      const mobile = viewportWidth < 768 || viewportWidth / viewportHeight < 1;
      const fov = THREE.MathUtils.degToRad(camera.fov);
      const visibleHeight = 2 * Math.tan(fov / 2) * 10;
      const visibleWidth = visibleHeight * camera.aspect;
      const screenX = mobile ? 0.5 : 0.517;
      const screenY = mobile ? 0.45 : 0.488;
      const edgePixels = Math.min(
        viewportHeight * 0.44,
        viewportWidth * (mobile ? 0.45 : 0.29)
      );
      pivot.position.set((screenX - 0.5) * visibleWidth, (0.5 - screenY) * visibleHeight, 0);
      pivot.scale.setScalar((edgePixels / viewportHeight) * visibleHeight);
      drawHeadline();
    }

    function installGeometry(geometry) {
      if (cube) {
        spinner.remove(cube);
        cube.geometry.dispose();
      }
      geometry.computeBoundingBox();
      const center = geometry.boundingBox.getCenter(new THREE.Vector3());
      geometry.translate(-center.x, -center.y, -center.z);
      geometry.computeBoundingBox();
      const size = geometry.boundingBox.getSize(new THREE.Vector3());
      const largestDimension = Math.max(size.x, size.y, size.z);
      if (!Number.isFinite(largestDimension) || largestDimension <= 0) {
        geometry.dispose();
        throw new Error('The loaded model has invalid dimensions.');
      }
      geometry.scale(1 / largestDimension, 1 / largestDimension, 1 / largestDimension);
      geometry.computeVertexNormals();
      cube = new THREE.Mesh(geometry, frontMaterial);
      cube.frustumCulled = false;
      spinner.add(cube);
      loaderLabel.classList.add('done');
      if (started) layout();
    }

    function makeFallbackCube() {
      const geometry = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
      geometry.computeVertexNormals();
      installGeometry(geometry);
    }

    function loadModel() {
      new GLTFLoader().load(
        MODEL_URL,
        (gltf) => {
          try {
            gltf.scene.updateMatrixWorld(true);
            const parts = [];
            gltf.scene.traverse((object) => {
              if (!object.isMesh || !object.geometry) return;
              const geometry = object.geometry.clone();
              geometry.deleteAttribute('uv');
              geometry.deleteAttribute('color');
              geometry.deleteAttribute('tangent');
              const welded = mergeVertices(geometry, 1e-4);
              welded.computeVertexNormals();
              welded.applyMatrix4(object.matrixWorld);
              parts.push(welded);
            });
            if (parts.length === 0) {
              throw new Error('The model contains no mesh geometry.');
            }
            const merged = mergeGeometries(parts, false);
            parts.forEach((part) => part.dispose());
            if (!merged) {
              throw new Error('The model meshes could not be merged.');
            }
            installGeometry(merged);
          } catch (error) {
            console.error('Unable to prepare the glass model; using the rounded cube fallback.', error);
            makeFallbackCube();
          }
        },
        undefined,
        (error) => {
          console.error('Unable to load the glass model; using the rounded cube fallback.', error);
          makeFallbackCube();
        }
      );
    }

    function rotateWorld(axis, angle) {
      tempQuaternion.setFromAxisAngle(axis, angle);
      spinner.quaternion.premultiply(tempQuaternion);
    }

    function onPointerDown(event) {
      if (event.button !== 0) return;
      dragging = true;
      spinRemaining = 0;
      velocityX = 0;
      velocityY = 0;
      pointerLastX = event.clientX;
      pointerLastY = event.clientY;
      pointerLastTime = performance.now();
      idleBlendStart = Number.POSITIVE_INFINITY;
      canvas.classList.add('dragging');
      canvas.setPointerCapture(event.pointerId);
      event.preventDefault();
    }

    function onPointerMove(event) {
      if (!dragging) return;
      const now = performance.now();
      const elapsedFrames = Math.max((now - pointerLastTime) / 16.667, 0.5);
      const dx = event.clientX - pointerLastX;
      const dy = event.clientY - pointerLastY;
      const angleX = dx * 0.008;
      const angleY = dy * 0.008;
      rotateWorld(axisY, angleX);
      rotateWorld(axisX, angleY);
      velocityX = angleX / elapsedFrames;
      velocityY = angleY / elapsedFrames;
      pointerLastX = event.clientX;
      pointerLastY = event.clientY;
      pointerLastTime = now;
    }

    function onPointerUp(event) {
      if (!dragging) return;
      dragging = false;
      canvas.classList.remove('dragging');
      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
      idleBlendStart = performance.now() + 600;
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);

    document.getElementById('prev').addEventListener('click', () => {
      spinRemaining = -Math.PI / 2;
      velocityX = 0;
      velocityY = 0;
      idleBlendStart = performance.now() + 600;
    });
    document.getElementById('next').addEventListener('click', () => {
      spinRemaining = Math.PI / 2;
      velocityX = 0;
      velocityY = 0;
      idleBlendStart = performance.now() + 600;
    });
    document.querySelectorAll('.dot').forEach((dot) => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.dot').forEach((item) => {
          item.classList.remove('active');
          item.removeAttribute('aria-current');
        });
        dot.classList.add('active');
        dot.setAttribute('aria-current', 'true');
      });
    });

    window.addEventListener('resize', () => {
      if (started) layout();
    });
    document.fonts.addEventListener('loadingdone', () => {
      if (started) drawHeadline();
    });

    function animate(now) {
      requestAnimationFrame(animate);
      if (!started || !cube) return;
      const dt = previousFrame ? Math.min((now - previousFrame) / 1000, 0.05) : 1 / 60;
      previousFrame = now;
      const frameScale = dt * 60;

      if (!dragging) {
        if (Math.abs(spinRemaining) > 0.0005) {
          const step = spinRemaining * Math.min(1, 0.09 * frameScale);
          rotateWorld(axisY, step);
          spinRemaining -= step;
        } else {
          spinRemaining = 0;
        }

        if (Math.abs(velocityX) > 0.00001 || Math.abs(velocityY) > 0.00001) {
          rotateWorld(axisY, velocityX * frameScale);
          rotateWorld(axisX, velocityY * frameScale);
          const damping = Math.pow(0.94, frameScale);
          velocityX *= damping;
          velocityY *= damping;
        }

        const idleDelayElapsed = now >= idleBlendStart;
        const blend = idleDelayElapsed
          ? Math.min(1, (now - idleBlendStart) / 1000)
          : 0;
        if (blend > 0) {
          rotateWorld(axisY, 0.0035 * frameScale * blend);
          rotateWorld(axisX, 0.0012 * frameScale * blend);
        }
      }

      renderer.setRenderTarget(rtBack);
      renderer.autoClear = true;
      renderer.render(bgScene, bgCamera);

      renderer.setRenderTarget(rtFront);
      renderer.autoClear = true;
      renderer.render(bgScene, bgCamera);
      renderer.autoClear = false;
      cube.material = backMaterial;
      renderer.render(scene, camera);

      renderer.setRenderTarget(null);
      renderer.autoClear = true;
      renderer.render(bgScene, bgCamera);
      renderer.autoClear = false;
      renderer.clearDepth();
      cube.material = frontMaterial;
      renderer.render(scene, camera);
      renderer.autoClear = true;
    }

    loadModel();
    fontReady.then(() => {
      layout();
      started = true;
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
